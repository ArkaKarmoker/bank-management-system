<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Midnight Slate/Indigo -->
    <linearGradient id="fintech-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Primary Arc Gradient: Electric Cyan to Vivid Indigo -->
    <linearGradient id="fintech-cyan-indigo" x1="10" y1="14" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Secondary Arc Gradient: Electric Violet to Vibrant Teal -->
    <linearGradient id="fintech-violet-teal" x1="54" y1="14" x2="10" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Core Radiant Highlight -->
    <linearGradient id="fintech-core-grad" x1="28" y1="28" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="fintech-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Squircle with Precision Border -->
  <rect width="64" height="64" rx="16" fill="url(#fintech-bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ambient Core Glow -->
  <circle cx="32" cy="32" r="16" fill="#6366f1" fill-opacity="0.25" filter="blur(8px)" />

  <!-- Modern Fintech Emblem: Dynamic Interlocking Growth Chevrons -->
  <g filter="url(#fintech-shadow)">
    <!-- Ascending Primary Wing (Growth / Capital Flow) -->
    <path
      d="M18 43L32 17L46 43"
      stroke="url(#fintech-cyan-indigo)"
      stroke-width="5.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Foundation Interlocking Wing (Security / Liquidity Vault) -->
    <path
      d="M21 31L32 47L43 31"
      stroke="url(#fintech-violet-teal)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Precision Nexus Diamond -->
    <path
      d="M32 26.5L36 32L32 37.5L28 32Z"
      fill="url(#fintech-core-grad)"
    />
  </g>
</svg>
